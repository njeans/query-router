<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Query Router - Pipeline Demo</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #7c4dff;
    --green: #3fb950;
    --red: #f85149;
    --blue: #58a6ff;
    --orange: #d29922;
    --pink: #f78166;
    --cyan: #39d353;
    --purple: #bc8cff;
    --teal: #56d4dd;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-size: 2.2rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p {
    color: var(--text-muted);
    font-size: 1.05rem;
    margin-top: 0.3rem;
  }

  /* Input section */
  .input-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 2rem;
  }

  .input-row {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1rem;
    align-items: center;
  }

  .input-row label {
    color: var(--text-muted);
    font-size: 0.85rem;
    white-space: nowrap;
  }

  select {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
    font-size: 0.95rem;
    cursor: pointer;
  }

  textarea {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    line-height: 1.5;
    resize: vertical;
    min-height: 80px;
    font-family: inherit;
  }

  textarea:focus, select:focus { outline: none; border-color: var(--accent); }

  .btn-row {
    display: flex;
    gap: 0.75rem;
    margin-top: 1rem;
    align-items: center;
  }

  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.65rem 1.75rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-secondary {
    background: var(--border);
    color: var(--text-muted);
  }

  /* Pipeline steps */
  .pipeline { position: relative; }

  .step {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 1.5rem;
    overflow: hidden;
    opacity: 0;
    transform: translateY(20px);
    animation: stepIn 0.4s ease forwards;
  }

  @keyframes stepIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .step-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
  }

  .step-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }

  .step-title {
    font-weight: 600;
    font-size: 1.05rem;
  }

  .step-subtitle {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-left: auto;
  }

  .provider-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
  }

  .provider-badge svg { width: 13px; height: 13px; flex-shrink: 0; }

  .provider-badge.tinfoil {
    background: #0a2a1a;
    color: #3fb950;
    border: 1px solid #1a4a2a;
  }

  .provider-badge.darkbloom {
    background: #0d1e3a;
    color: #58a6ff;
    border: 1px solid #1a3a5f;
  }

  .step-body { padding: 1.25rem; }

  /* Sanitized text with colored placeholders */
  .sanitized-text {
    background: var(--bg);
    border-radius: 8px;
    padding: 1rem;
    font-size: 1rem;
    line-height: 1.7;
    margin-bottom: 1rem;
  }

  .ph { border-radius: 4px; padding: 1px 5px; font-weight: 600; font-size: 0.9rem; }
  .ph-PERSON { background: #1e3a5f; color: var(--blue); }
  .ph-COMPANY { background: #2d1b4e; color: var(--purple); }
  .ph-LOCATION { background: #1a3a2a; color: var(--green); }
  .ph-AMOUNT { background: #3a2e1a; color: var(--orange); }
  .ph-MEDICAL { background: #3a1a1a; color: var(--red); }
  .ph-JOB_TITLE { background: #1a3a3a; color: var(--teal); }
  .ph-VISA_TYPE { background: #3a1a2e; color: var(--pink); }
  .ph-AGE { background: #3a3a1a; color: #ffd54f; }
  .ph-TECH { background: #1a2e3a; color: var(--cyan); }
  .ph-HOSTNAME { background: #1e3a5f; color: var(--blue); }
  .ph-NUMBER, .ph-DATE, .ph-EMAIL, .ph-URL, .ph-IP, .ph-PHONE, .ph-API_KEY {
    background: #2a2a2a; color: var(--text-muted);
  }

  /* Placeholder map table */
  .ph-map {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.3rem 1rem;
    font-size: 0.9rem;
  }

  .ph-map-key { font-weight: 600; }
  .ph-map-arrow { color: var(--text-muted); }
  .ph-map-val { color: var(--text-muted); }

  /* Fragment cards */
  .fragment-card {
    background: var(--bg);
    border-radius: 8px;
    padding: 0.85rem 1rem;
    margin-bottom: 0.75rem;
    border-left: 3px solid var(--border);
    font-size: 0.95rem;
  }

  .fragment-card.safe { border-left-color: var(--green); }
  .fragment-card.leaked { border-left-color: var(--red); }

  .fragment-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.3rem;
  }

  .fragment-label.safe { color: var(--green); }
  .fragment-label.leaked { color: var(--red); }

  .leak-reason {
    font-size: 0.8rem;
    color: var(--red);
    margin-top: 0.3rem;
    font-style: italic;
  }

  /* Remote exchange */
  .exchange {
    margin-bottom: 1.25rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
  }

  .exchange:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

  .exchange-sent {
    background: #0d2137;
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
    border-left: 3px solid var(--blue);
  }

  .exchange-recv {
    background: #0d2818;
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-size: 0.9rem;
    border-left: 3px solid var(--green);
  }

  .exchange-label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.25rem;
  }

  .exchange-label.sent { color: var(--blue); }
  .exchange-label.recv { color: var(--green); }

  /* Final answer */
  .answer-block {
    background: var(--bg);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    font-size: 0.95rem;
    line-height: 1.7;
    white-space: pre-wrap;
  }

  .answer-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
  }

  .answer-section { margin-bottom: 1.25rem; }
  .answer-section:last-child { margin-bottom: 0; }

  /* Connector lines between steps */
  .connector {
    width: 2px;
    height: 1.5rem;
    background: var(--border);
    margin: -0.75rem auto 0.75rem;
    opacity: 0;
    animation: stepIn 0.3s ease forwards;
  }

  /* Confirm step */
  .confirm-actions {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.25rem;
  }

  .btn-approve {
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1.5rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .btn-approve:hover { opacity: 0.85; }

  .btn-reject {
    background: transparent;
    color: var(--red);
    border: 1px solid var(--red);
    border-radius: 8px;
    padding: 0.6rem 1.5rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .btn-reject:hover { opacity: 0.7; }

  .confirm-note {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-top: 0.75rem;
    font-style: italic;
  }

  .rejected-banner {
    background: #2d1215;
    border: 1px solid var(--red);
    border-radius: 8px;
    padding: 0.85rem 1rem;
    color: var(--red);
    font-weight: 600;
    text-align: center;
    margin-top: 1rem;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 2rem;
    color: var(--text-muted);
  }

  .spinner {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 0.5rem;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Query Router</h1>
    <p>Privacy-Preserving Query Proxy &mdash; Pipeline Demo</p>
  </header>

  <div class="input-section">
    <div class="input-row">
      <label>Example:</label>
      <select id="examples">
        <option value="">Custom query...</option>
        <option value="pilot_diabetes">Pilot with diabetes diagnosis</option>
        <option value="cofounder_ip">Cofounder IP theft</option>
        <option value="acquisition">Fintech acquisition</option>
        <option value="jwt_leak">JWT secret leak</option>
        <option value="harassment_visa">Harassment on H-1B visa</option>
      </select>
    </div>
    <textarea id="query" placeholder="Enter a sensitive query to see how the pipeline protects it...">My cofounder at Acme Robotics is threatening to leave with our source code. We never signed an IP assignment. What can I do?</textarea>
    <div class="btn-row">
      <button id="run">Run Pipeline</button>
      <button id="clear" class="btn-secondary">Clear</button>
    </div>
  </div>

  <div id="pipeline" class="pipeline"></div>
</div>

<script>
const EXAMPLES = {
  pilot_diabetes: "I'm a 34-year-old pilot at Delta and just got diagnosed with type 1 diabetes. Will I lose my medical certificate, and should I tell HR before my next check ride?",
  cofounder_ip: "My cofounder at Acme Robotics is threatening to leave with our source code. We never signed an IP assignment. What can I do?",
  acquisition: "We're considering acquiring a 40-person fintech in Austin at around $60M. How should we structure earnouts to keep their CTO?",
  jwt_leak: "Our production API at api.example.com uses JWTs signed with HS256 and the secret is in a public GitHub repo. How bad is this and how do we rotate without downtime?",
  harassment_visa: "My manager Sarah keeps scheduling 1:1s after hours and commenting on my appearance. I'm on an H-1B. Can I report this without risking my visa?",
};

const STEP_COLORS = {
  sanitize:   '#f85149',
  decompose:  '#56d4dd',
  leak_check: '#d29922',
  confirm:    '#58a6ff',
  remote:     '#3fb950',
  recombine:  '#bc8cff',
};

const PROVIDER_BADGES = {
  tinfoil: `<span class="provider-badge tinfoil"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0L1 3v5c0 4.1 3 6.7 7 8 4-1.3 7-3.9 7-8V3L8 0z"/></svg>Tinfoil</span>`,
  darkbloom: `<span class="provider-badge darkbloom"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="3"/><circle cx="8" cy="2.5" r="2.2" opacity=".6"/><circle cx="13" cy="5.5" r="2.2" opacity=".6"/><circle cx="11" cy="11.5" r="2.2" opacity=".6"/><circle cx="5" cy="11.5" r="2.2" opacity=".6"/><circle cx="3" cy="5.5" r="2.2" opacity=".6"/></svg>Darkbloom</span>`,
};

const $examples = document.getElementById('examples');
const $query = document.getElementById('query');
const $run = document.getElementById('run');
const $clear = document.getElementById('clear');
const $pipeline = document.getElementById('pipeline');

$examples.addEventListener('change', () => {
  if ($examples.value && EXAMPLES[$examples.value]) {
    $query.value = EXAMPLES[$examples.value];
  }
});

$clear.addEventListener('click', () => {
  $pipeline.innerHTML = '';
  $examples.value = '';
  $query.value = '';
  $query.focus();
});

$run.addEventListener('click', runPipeline);

async function runPipeline() {
  const query = $query.value.trim();
  if (!query) return;

  $run.disabled = true;
  $pipeline.innerHTML = '<div class="loading"><span class="spinner"></span>Running pipeline...</div>';

  try {
    const resp = await fetch('/api/trace', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query, mock: true}),
    });
    const data = await resp.json();
    renderPipeline(data);
  } catch (err) {
    $pipeline.innerHTML = `<div class="loading" style="color:var(--red)">Error: ${err.message}</div>`;
  } finally {
    $run.disabled = false;
  }
}

function renderPipeline(data) {
  $pipeline.innerHTML = '';

  // Steps before the confirmation gate
  const preSteps = [
    () => renderSanitize(data),
    () => renderDecompose(data),
    () => renderLeakCheck(data),
  ];

  let delay = 0;
  preSteps.forEach((fn, i) => {
    setTimeout(() => {
      appendConnector(i);
      appendStep(fn());
    }, delay);
    delay += 500;
  });

  // After leak check, show the confirm gate
  setTimeout(() => {
    appendConnector(preSteps.length);
    const confirmEl = renderConfirm(data);
    appendStep(confirmEl);
  }, delay);
}

function appendConnector(stepIndex) {
  if (stepIndex > 0) {
    const conn = document.createElement('div');
    conn.className = 'connector';
    conn.style.animationDelay = '0s';
    $pipeline.appendChild(conn);
  }
}

function appendStep(el) {
  el.style.animationDelay = '0.05s';
  $pipeline.appendChild(el);
  el.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

function continueAfterConfirm(data) {
  const postSteps = [
    () => renderRemote(data),
    () => renderRecombine(data),
  ];
  let delay = 0;
  postSteps.forEach((fn, i) => {
    setTimeout(() => {
      appendConnector(1); // always add connector
      appendStep(fn());
    }, delay);
    delay += 500;
  });
}

function makeStep(num, title, subtitle, color, provider) {
  const step = document.createElement('div');
  step.className = 'step';

  const header = document.createElement('div');
  header.className = 'step-header';
  const badge = provider ? PROVIDER_BADGES[provider] : '';
  header.innerHTML = `
    <span class="step-num" style="background:${color}">${num}</span>
    <span class="step-title">${title}</span>
    ${badge}
    ${subtitle ? `<span class="step-subtitle">${subtitle}</span>` : ''}
  `;

  const body = document.createElement('div');
  body.className = 'step-body';

  step.appendChild(header);
  step.appendChild(body);
  step._body = body;
  return step;
}

function highlightPlaceholders(text) {
  return text.replace(/\[([A-Z_]+?)_(\d+)\]/g, (match, cat) => {
    return `<span class="ph ph-${cat}">${match}</span>`;
  });
}

function renderSanitize(data) {
  const count = Object.keys(data.placeholder_map).length;
  const step = makeStep(1, 'Sanitize', `${count} entities detected`, STEP_COLORS.sanitize, 'tinfoil');

  let html = `<div class="sanitized-text">${highlightPlaceholders(esc(data.sanitized_text))}</div>`;

  if (count > 0) {
    html += '<div class="ph-map">';
    for (const [ph, val] of Object.entries(data.placeholder_map)) {
      const cat = ph.replace(/\[([A-Z_]+?)_\d+\]/, '$1');
      html += `<span class="ph-map-key"><span class="ph ph-${cat}">${esc(ph)}</span></span>`;
      html += `<span class="ph-map-val">\u2192 ${esc(val)}</span>`;
    }
    html += '</div>';
  }

  step._body.innerHTML = html;
  return step;
}

function renderDecompose(data) {
  const step = makeStep(2, 'Decompose', `${data.fragments.length} sub-questions`, STEP_COLORS.decompose, 'tinfoil');
  let html = '';
  data.fragments.forEach((f, i) => {
    html += `<div class="fragment-card"><div class="fragment-label" style="color:var(--teal)">Fragment ${i + 1}</div>${esc(f)}</div>`;
  });
  step._body.innerHTML = html;
  return step;
}

function renderLeakCheck(data) {
  const passed = data.leak_checks.filter(r => r.passed).length;
  const total = data.leak_checks.length;
  const allPassed = passed === total;
  const subtitle = allPassed ? `${passed}/${total} passed` : `${passed}/${total} passed`;
  const step = makeStep(3, 'Leak Check', subtitle, STEP_COLORS.leak_check, 'tinfoil');

  let html = '';
  data.leak_checks.forEach((r, i) => {
    const cls = r.passed ? 'safe' : 'leaked';
    const icon = r.passed ? '\u2705' : '\u274c';
    html += `<div class="fragment-card ${cls}">`;
    html += `<div class="fragment-label ${cls}">${icon} Fragment ${i + 1} \u2014 ${r.passed ? 'Safe' : 'Leaked'}</div>`;
    html += esc(r.text);
    if (r.reason) html += `<div class="leak-reason">${esc(r.reason)}</div>`;
    html += '</div>';
  });

  step._body.innerHTML = html;
  return step;
}

function renderConfirm(data) {
  const safeCount = data.leak_checks.filter(r => r.passed).length;
  const step = makeStep(4, 'Confirm', `${safeCount} fragments ready to send`, STEP_COLORS.confirm);

  let html = '<div style="color:var(--text-muted);margin-bottom:1rem;">These fragments will be sent to Darkbloom as separate, unlinkable requests. Review them before approving.</div>';

  data.leak_checks.forEach((r, i) => {
    if (!r.passed) return;
    html += `<div class="fragment-card safe">`;
    html += `<div class="fragment-label safe">Fragment ${i + 1}</div>`;
    html += esc(r.text);
    html += '</div>';
  });

  if (safeCount === 0) {
    html += '<div class="rejected-banner">No safe fragments \u2014 pipeline will fall back to Tinfoil-only.</div>';
  } else {
    html += '<div class="confirm-actions">';
    html += '<button class="btn-approve" id="btn-approve">\u2713 Approve &amp; Send</button>';
    html += '<button class="btn-reject" id="btn-reject">\u2717 Reject</button>';
    html += '</div>';
    html += '<div class="confirm-note">Nothing leaves your machine until you approve.</div>';
  }

  step._body.innerHTML = html;

  // Wire up buttons after DOM insertion (use setTimeout so the element is in the DOM)
  setTimeout(() => {
    const approveBtn = document.getElementById('btn-approve');
    const rejectBtn = document.getElementById('btn-reject');
    if (approveBtn) {
      approveBtn.addEventListener('click', () => {
        approveBtn.disabled = true;
        rejectBtn.disabled = true;
        approveBtn.textContent = '\u2713 Approved';
        approveBtn.style.opacity = '0.6';
        rejectBtn.style.display = 'none';
        const note = step._body.querySelector('.confirm-note');
        if (note) note.textContent = 'Fragments sent.';
        continueAfterConfirm(data);
      });
      rejectBtn.addEventListener('click', () => {
        approveBtn.disabled = true;
        rejectBtn.disabled = true;
        rejectBtn.style.opacity = '0.6';
        approveBtn.style.display = 'none';
        const note = step._body.querySelector('.confirm-note');
        if (note) note.remove();
        const banner = document.createElement('div');
        banner.className = 'rejected-banner';
        banner.textContent = 'Rejected \u2014 zero fragments sent. Pipeline falls back to Tinfoil-only.';
        step._body.appendChild(banner);
      });
    }
  }, 50);

  return step;
}

function renderRemote(data) {
  const n = data.remote_exchanges.length;
  const step = makeStep(5, 'Remote Send', `${n} fragments sent`, STEP_COLORS.remote, 'darkbloom');

  if (n === 0) {
    step._body.innerHTML = '<div style="color:var(--text-muted);font-style:italic">No fragments sent \u2014 all failed leak check.</div>';
    return step;
  }

  let html = '';
  data.remote_exchanges.forEach((ex, i) => {
    html += '<div class="exchange">';
    html += `<div class="exchange-sent"><div class="exchange-label sent">\u2191 Sent (Fragment ${i + 1})</div>${esc(ex.sent)}</div>`;
    html += `<div class="exchange-recv"><div class="exchange-label recv">\u2193 Response</div>${esc(ex.response)}</div>`;
    html += '</div>';
  });

  step._body.innerHTML = html;
  return step;
}

function renderRecombine(data) {
  const step = makeStep(6, 'Recombine', data.tier === 'split' ? 'Merged & de-placeholdered' : 'Fallback', STEP_COLORS.recombine, 'tinfoil');

  let html = '';

  if (data.answer_with_placeholders !== data.final_answer) {
    html += '<div class="answer-section">';
    html += '<div class="answer-label">With placeholders</div>';
    html += `<div class="answer-block">${highlightPlaceholders(esc(data.answer_with_placeholders))}</div>`;
    html += '</div>';
  }

  html += '<div class="answer-section">';
  html += '<div class="answer-label">Final answer</div>';
  html += `<div class="answer-block">${formatAnswer(esc(data.final_answer))}</div>`;
  html += '</div>';

  step._body.innerHTML = html;
  return step;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function formatAnswer(html) {
  return html
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}
</script>
