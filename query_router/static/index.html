<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Query Sharding - Pipeline Demo</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #7c4dff;
    --green: #3fb950;
    --red: #f85149;
    --blue: #58a6ff;
    --orange: #d29922;
    --pink: #f78166;
    --cyan: #39d353;
    --purple: #bc8cff;
    --teal: #56d4dd;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-size: 2.2rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p {
    color: var(--text-muted);
    font-size: 1.05rem;
    margin-top: 0.3rem;
  }

  /* Input section */
  .input-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 2rem;
  }

  .input-row {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1rem;
    align-items: center;
  }

  .input-row label {
    color: var(--text-muted);
    font-size: 0.85rem;
    white-space: nowrap;
  }

  select {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
    font-size: 0.95rem;
    cursor: pointer;
  }

  textarea {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    line-height: 1.5;
    resize: vertical;
    min-height: 80px;
    font-family: inherit;
  }

  textarea:focus, select:focus { outline: none; border-color: var(--accent); }

  .btn-row {
    display: flex;
    gap: 0.75rem;
    margin-top: 1rem;
    align-items: center;
  }

  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.65rem 1.75rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-secondary {
    background: var(--border);
    color: var(--text-muted);
  }

  /* Pipeline steps */
  .pipeline { position: relative; }

  .step {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 1.5rem;
    overflow: hidden;
    opacity: 0;
    transform: translateY(20px);
    animation: stepIn 0.4s ease forwards;
  }

  @keyframes stepIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .step-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
  }

  .step-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }

  .step-title {
    font-weight: 600;
    font-size: 1.05rem;
  }

  .step-subtitle {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-left: auto;
  }

  .provider-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
  }

  .provider-badge svg { width: 13px; height: 13px; flex-shrink: 0; }

  .provider-badge.nearai {
    background: #0a1a2e;
    color: #56d4dd;
    border: 1px solid #1a3a4a;
  }

  .provider-badge.incognito {
    background: #1a1a2a;
    color: #8b8bab;
    border: 1px solid #2a2a3f;
  }

  .step-body { padding: 1.25rem; }

  /* Sanitized text with colored placeholders */
  .sanitized-text {
    background: var(--bg);
    border-radius: 8px;
    padding: 1rem;
    font-size: 1rem;
    line-height: 1.7;
    margin-bottom: 1rem;
  }

  .ph { border-radius: 4px; padding: 1px 5px; font-weight: 600; font-size: 0.9rem; }
  .ph-PERSON { background: #1e3a5f; color: var(--blue); }
  .ph-COMPANY { background: #2d1b4e; color: var(--purple); }
  .ph-LOCATION { background: #1a3a2a; color: var(--green); }
  .ph-AMOUNT { background: #3a2e1a; color: var(--orange); }
  .ph-MEDICAL { background: #3a1a1a; color: var(--red); }
  .ph-JOB_TITLE { background: #1a3a3a; color: var(--teal); }
  .ph-VISA_TYPE { background: #3a1a2e; color: var(--pink); }
  .ph-AGE { background: #3a3a1a; color: #ffd54f; }
  .ph-TECH { background: #1a2e3a; color: var(--cyan); }
  .ph-HOSTNAME { background: #1e3a5f; color: var(--blue); }
  .ph-NUMBER, .ph-DATE, .ph-EMAIL, .ph-URL, .ph-IP, .ph-PHONE, .ph-API_KEY {
    background: #2a2a2a; color: var(--text-muted);
  }

  /* Placeholder map table */
  .ph-map {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.3rem 1rem;
    font-size: 0.9rem;
  }

  .ph-map-key { font-weight: 600; }
  .ph-map-arrow { color: var(--text-muted); }
  .ph-map-val { color: var(--text-muted); }

  /* Fragment cards */
  .fragment-card {
    background: var(--bg);
    border-radius: 8px;
    padding: 0.85rem 1rem;
    margin-bottom: 0.75rem;
    border-left: 3px solid var(--border);
    font-size: 0.95rem;
  }

  .fragment-card.safe { border-left-color: var(--green); }
  .fragment-card.leaked { border-left-color: var(--red); }

  .fragment-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.3rem;
  }

  .fragment-label.safe { color: var(--green); }
  .fragment-label.leaked { color: var(--red); }

  .leak-reason {
    font-size: 0.8rem;
    color: var(--red);
    margin-top: 0.3rem;
    font-style: italic;
  }

  /* Remote exchange */
  .exchange {
    margin-bottom: 1.25rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
  }

  .exchange:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

  .exchange-sent {
    background: #0d2137;
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
    border-left: 3px solid var(--blue);
  }

  .exchange-recv {
    background: #0d2818;
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-size: 0.9rem;
    border-left: 3px solid var(--green);
  }

  .exchange-label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.25rem;
  }

  .exchange-label.sent { color: var(--blue); }
  .exchange-label.recv { color: var(--green); }

  /* Final answer */
  .answer-block {
    background: var(--bg);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    font-size: 0.95rem;
    line-height: 1.7;
    white-space: pre-wrap;
  }

  .answer-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
  }

  .answer-section { margin-bottom: 1.25rem; }
  .answer-section:last-child { margin-bottom: 0; }

  /* Connector lines between steps */
  .connector {
    width: 2px;
    height: 1.5rem;
    background: var(--border);
    margin: -0.75rem auto 0.75rem;
    opacity: 0;
    animation: stepIn 0.3s ease forwards;
  }

  /* Confirm step */
  .confirm-actions {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.25rem;
  }

  .btn-approve {
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1.5rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .btn-approve:hover { opacity: 0.85; }

  .btn-reject {
    background: transparent;
    color: var(--red);
    border: 1px solid var(--red);
    border-radius: 8px;
    padding: 0.6rem 1.5rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .btn-reject:hover { opacity: 0.7; }

  .confirm-note {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-top: 0.75rem;
    font-style: italic;
  }

  .rejected-banner {
    background: #2d1215;
    border: 1px solid var(--red);
    border-radius: 8px;
    padding: 0.85rem 1rem;
    color: var(--red);
    font-weight: 600;
    text-align: center;
    margin-top: 1rem;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 2rem;
    color: var(--text-muted);
  }

  .spinner {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 0.5rem;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Model selector */
  .model-section {
    margin-top: 1.25rem;
    border-top: 1px solid var(--border);
    padding-top: 1rem;
  }
  .model-section-title {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.75rem;
  }
  .model-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.5rem;
  }
  .model-row:last-child { margin-bottom: 0; }
  .frag-label {
    font-size: 0.78rem;
    color: var(--text-muted);
    white-space: nowrap;
    min-width: 78px;
  }
  .provider-dot {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    font-weight: 800;
    flex-shrink: 0;
    color: #fff;
    line-height: 1;
    transition: background 0.2s;
  }
  .pdot-Anthropic { background: #d97706; }
  .pdot-Google { background: #4285f4; }
  .pdot-OpenAI { background: #10a37f; }
  .pdot-DeepSeek { background: #0066ff; }
  .pdot-xAI { background: #666; }
  .pdot-Qwen { background: #7c3aed; }
  .pdot-Moonshot { background: #eab308; color: #000; }
  .pdot-Typesafe { background: #0d9488; }
  .pdot-NearAI { background: #0a2a3a; color: #56d4dd; border: 1px solid #1a4a5a; }
  .pdot-Levanto { background: #1a3a2e; color: #3fb950; border: 1px solid #2a5a3e; }
  .model-select { flex: 1; }
  .tee-description {
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-top: 0.4rem;
    font-style: italic;
  }
  .exchange-model {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    margin-left: 0.5rem;
    font-size: 0.72rem;
    color: var(--text-muted);
  }
  .exchange-model .provider-dot { width: 16px; height: 16px; font-size: 0.5rem; border-radius: 3px; }
  .confirm-model {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-left: 0.5rem;
  }
  .confirm-model .provider-dot { width: 16px; height: 16px; font-size: 0.5rem; border-radius: 3px; }

  /* Attestation step */
  .attest-group {
    margin-bottom: 1.25rem;
  }
  .attest-group:last-child { margin-bottom: 0; }
  .attest-group-title {
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .attest-group-title .status {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 0.1rem 0.45rem;
    border-radius: 4px;
  }
  .attest-group-title .status.ok { background: #0d2818; color: var(--green); }
  .attest-group-title .status.fail { background: #2d1215; color: var(--red); }
  .attest-items {
    background: var(--bg);
    border-radius: 8px;
    padding: 0.65rem 0.85rem;
  }
  .attest-item {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    font-size: 0.85rem;
    padding: 0.2rem 0;
  }
  .attest-icon { flex-shrink: 0; font-size: 0.75rem; }
  .attest-label { color: var(--text-muted); min-width: 100px; }
  .attest-value { color: var(--text); }
  .attest-hash {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 0.75rem;
    color: var(--text-muted);
    background: var(--surface);
    padding: 0.1rem 0.4rem;
    border-radius: 3px;
    word-break: break-all;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Query Sharding</h1>
    <p>Privacy-Preserving Query Proxy &mdash; Pipeline Demo</p>
  </header>

  <div class="input-section">
    <div class="input-row">
      <label>Example:</label>
      <select id="examples">
        <option value="">Custom query...</option>
        <option value="pilot_diabetes">Pilot with diabetes diagnosis</option>
        <option value="cofounder_ip">Cofounder IP theft</option>
        <option value="acquisition">Fintech acquisition</option>
        <option value="jwt_leak">JWT secret leak</option>
        <option value="harassment_visa">Harassment on H-1B visa</option>
      </select>
    </div>
    <textarea id="query" placeholder="Enter a sensitive query to see how the pipeline protects it...">My cofounder at Acme Robotics is threatening to leave with our source code. We never signed an IP assignment. What can I do?</textarea>
    <div class="btn-row">
      <button id="run">Run Pipeline</button>
      <button id="clear" class="btn-secondary">Clear</button>
    </div>

    <div class="model-section">
      <div class="model-section-title">Private TEE Model &mdash; trusted processing (e2ee)</div>
      <div class="model-row">
        <span class="provider-dot pdot-NearAI" id="dot-tee">N</span>
        <select class="model-select" id="model-tee"></select>
      </div>
      <div class="tee-description">Runs in a secure enclave. Not even NEAR AI can see your prompts.</div>
    </div>

    <div class="model-section">
      <div class="model-section-title">Incognito Models &mdash; each fragment routes to a different provider</div>
      <div class="model-row">
        <span class="frag-label">Fragment 1</span>
        <span class="provider-dot pdot-Google" id="dot1">G</span>
        <select class="model-select" id="model1"></select>
      </div>
      <div class="model-row">
        <span class="frag-label">Fragment 2</span>
        <span class="provider-dot pdot-Anthropic" id="dot2">A</span>
        <select class="model-select" id="model2"></select>
      </div>
      <div class="model-row">
        <span class="frag-label">Fragment 3</span>
        <span class="provider-dot pdot-OpenAI" id="dot3">O</span>
        <select class="model-select" id="model3"></select>
      </div>
    </div>
  </div>

  <div id="pipeline" class="pipeline"></div>
</div>

<script>
const EXAMPLES = {
  pilot_diabetes: "I'm a 34-year-old pilot at Delta and just got diagnosed with type 1 diabetes. Will I lose my medical certificate, and should I tell HR before my next check ride?",
  cofounder_ip: "My cofounder at Acme Robotics is threatening to leave with our source code. We never signed an IP assignment. What can I do?",
  acquisition: "We're considering acquiring a 40-person fintech in Austin at around $60M. How should we structure earnouts to keep their CTO?",
  jwt_leak: "Our production API at api.example.com uses JWTs signed with HS256 and the secret is in a public GitHub repo. How bad is this and how do we rotate without downtime?",
  harassment_visa: "My manager Sarah keeps scheduling 1:1s after hours and commenting on my appearance. I'm on an H-1B. Can I report this without risking my visa?",
};

const STEP_COLORS = {
  attest:     '#2ea043',
  sanitize:   '#f85149',
  decompose:  '#56d4dd',
  leak_check: '#d29922',
  confirm:    '#58a6ff',
  remote:     '#3fb950',
  recombine:  '#bc8cff',
};

const PROVIDER_BADGES = {
  nearai: `<span class="provider-badge nearai"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1L2 4.5v7L8 15l6-3.5v-7L8 1zm0 2l4 2.3v4.4L8 12 4 9.7V5.3L8 3z"/></svg>Near AI</span>`,
  incognito: `<span class="provider-badge incognito"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 2C5 2 2.7 4.7 2 6c-.7 1.3 0 0 0 0C2.7 7.3 5 10 8 10s5.3-2.7 6-4c-.7-1.3-3-4-6-4zm0 6.5A2.5 2.5 0 1 1 8 3.5a2.5 2.5 0 0 1 0 5zM1 12h14v1.5H1z"/></svg>Incognito</span>`,
};

const $examples = document.getElementById('examples');
const $query = document.getElementById('query');
const $run = document.getElementById('run');
const $clear = document.getElementById('clear');
const $pipeline = document.getElementById('pipeline');

$examples.addEventListener('change', () => {
  if ($examples.value && EXAMPLES[$examples.value]) {
    $query.value = EXAMPLES[$examples.value];
  }
});

$clear.addEventListener('click', () => {
  $pipeline.innerHTML = '';
  $examples.value = '';
  $query.value = '';
  $query.focus();
});

$run.addEventListener('click', runPipeline);

// ---------------------------------------------------------------------------
// Incognito model catalogue (from Near AI)
// ---------------------------------------------------------------------------
const INCOGNITO_MODELS = [
  {id:'anthropic/claude-fable-5',name:'Claude Fable 5',provider:'Anthropic'},
  {id:'anthropic/claude-fable-5.1',name:'Claude Fable 5.1',provider:'Anthropic'},
  {id:'anthropic/claude-fable-5.2',name:'Claude Fable 5.2',provider:'Anthropic'},
  {id:'anthropic/claude-haiku-4.5',name:'Claude Haiku 4.5',provider:'Anthropic'},
  {id:'anthropic/claude-haiku-5.5',name:'Claude Haiku 5.5',provider:'Anthropic'},
  {id:'anthropic/claude-opus-4.6',name:'Claude Opus 4.6',provider:'Anthropic'},
  {id:'anthropic/claude-opus-4.7',name:'Claude Opus 4.7',provider:'Anthropic'},
  {id:'anthropic/claude-opus-4.8',name:'Claude Opus 4.8',provider:'Anthropic'},
  {id:'anthropic/claude-opus-5',name:'Claude Opus 5',provider:'Anthropic'},
  {id:'anthropic/claude-opus-5.5',name:'Claude Opus 5.5',provider:'Anthropic'},
  {id:'anthropic/claude-sonnet-4.5',name:'Claude Sonnet 4.5',provider:'Anthropic'},
  {id:'anthropic/claude-sonnet-4.6',name:'Claude Sonnet 4.6',provider:'Anthropic'},
  {id:'anthropic/claude-sonnet-5',name:'Claude Sonnet 5',provider:'Anthropic'},
  {id:'anthropic/claude-sonnet-5.5',name:'Claude Sonnet 5.5',provider:'Anthropic'},
  {id:'deepseek/deepseek-v4.1-flash',name:'DeepSeek V4.1 Flash',provider:'DeepSeek'},
  {id:'deepseek/deepseek-v4.1-flash-1017',name:'DeepSeek V4.1 Flash 1017',provider:'DeepSeek'},
  {id:'google/gemini-2.5-flash',name:'Gemini 2.5 Flash',provider:'Google'},
  {id:'google/gemini-2.5-flash-lite',name:'Gemini 2.5 Flash Lite',provider:'Google'},
  {id:'google/gemini-2.5-pro',name:'Gemini 2.5 Pro',provider:'Google'},
  {id:'google/gemini-3.1-flash-lite',name:'Gemini 3.1 Flash Lite',provider:'Google'},
  {id:'google/gemini-3.5-flash',name:'Gemini 3.5 Flash',provider:'Google'},
  {id:'google/gemini-3.8-flash',name:'Gemini 3.8 Flash',provider:'Google'},
  {id:'moonshot/kimi-k3.1-pro',name:'Kimi K3.1 Pro',provider:'Moonshot AI'},
  {id:'openai/gpt-4.1',name:'GPT-4.1',provider:'OpenAI'},
  {id:'openai/gpt-4.1-mini',name:'GPT-4.1 Mini',provider:'OpenAI'},
  {id:'openai/gpt-5',name:'GPT-5',provider:'OpenAI'},
  {id:'openai/gpt-5-mini',name:'GPT-5 Mini',provider:'OpenAI'},
  {id:'openai/gpt-5-nano',name:'GPT-5 Nano',provider:'OpenAI'},
  {id:'openai/gpt-5.1',name:'GPT-5.1',provider:'OpenAI'},
  {id:'openai/gpt-5.2',name:'GPT-5.2',provider:'OpenAI'},
  {id:'openai/gpt-5.4',name:'GPT-5.4',provider:'OpenAI'},
  {id:'openai/gpt-5.4-mini',name:'GPT-5.4 Mini',provider:'OpenAI'},
  {id:'openai/gpt-5.4-nano',name:'GPT-5.4 Nano',provider:'OpenAI'},
  {id:'openai/gpt-5.5',name:'GPT-5.5',provider:'OpenAI'},
  {id:'openai/gpt-5.6-luna',name:'GPT-5.6 Luna',provider:'OpenAI'},
  {id:'openai/gpt-5.6-sol',name:'GPT-5.6 Sol',provider:'OpenAI'},
  {id:'openai/gpt-6-astra',name:'GPT-6 Astra',provider:'OpenAI'},
  {id:'openai/gpt-6-luna',name:'GPT-6 Luna',provider:'OpenAI'},
  {id:'openai/gpt-6-sol',name:'GPT-6 Sol',provider:'OpenAI'},
  {id:'openai/gpt-6.1-sol',name:'GPT-6.1 Sol',provider:'OpenAI'},
  {id:'openai/o3',name:'o3',provider:'OpenAI'},
  {id:'openai/o3-mini',name:'o3 Mini',provider:'OpenAI'},
  {id:'openai/o4-mini',name:'o4 Mini',provider:'OpenAI'},
  {id:'qwen/qwen3.7-max',name:'Qwen3.7 Max',provider:'Qwen'},
  {id:'typesafe/jev-1.13',name:'Jev 1.13',provider:'Typesafe'},
  {id:'xai/grok-4.6',name:'Grok 4.6',provider:'xAI'},
  {id:'xai/grok-4.7',name:'Grok 4.7',provider:'xAI'},
];

// ---------------------------------------------------------------------------
// Private TEE model catalogue (from Near AI)
// ---------------------------------------------------------------------------
const TEE_MODELS = [
  {id:'nearai/deepseek-v4.1-flash-1017',name:'DeepSeek V4.1 Flash 1017',provider:'NEAR AI'},
  {id:'nearai/deepseek-v4.1-flash-1017-abliterated',name:'DeepSeek V4.1 Flash 1017 Abliterated',provider:'NEAR AI'},
  {id:'nearai/glm-5.3-flash',name:'GLM 5.3 Flash',provider:'NEAR AI'},
  {id:'nearai/qwen-3.6-35b-a3b-fp8',name:'Qwen 3.6 35B A3B FP8',provider:'NEAR AI'},
  {id:'nearai/qwen-3.8-27b',name:'Qwen 3.8 27B',provider:'NEAR AI'},
  {id:'nearai/qwen-3.8-27b-abliterated',name:'Qwen 3.8 27B Abliterated',provider:'NEAR AI'},
  {id:'nearai/qwen3-vl-30b-a3b-instruct',name:'Qwen3-VL-30B-A3B-Instruct',provider:'NEAR AI'},
  {id:'levanto/levanto-sage-2',name:'Levanto Sage 2',provider:'Levanto'},
];

const TEE_DEFAULT = 'nearai/glm-5.3-flash';

const PROVIDER_LETTER = {
  'Anthropic':'A','Google':'G','OpenAI':'O','DeepSeek':'D',
  'xAI':'X','Qwen':'Q','Moonshot AI':'M','Typesafe':'T',
  'NEAR AI':'N','Levanto':'L',
};
const PROVIDER_CSS = {
  'Anthropic':'pdot-Anthropic','Google':'pdot-Google','OpenAI':'pdot-OpenAI',
  'DeepSeek':'pdot-DeepSeek','xAI':'pdot-xAI','Qwen':'pdot-Qwen',
  'Moonshot AI':'pdot-Moonshot','Typesafe':'pdot-Typesafe',
  'NEAR AI':'pdot-NearAI','Levanto':'pdot-Levanto',
};

const MODEL_DEFAULTS = [
  'google/gemini-2.5-flash',
  'anthropic/claude-sonnet-4.6',
  'openai/gpt-4.1-mini',
];

function dotHtml(provider, sm) {
  const cls = PROVIDER_CSS[provider] || '';
  const letter = PROVIDER_LETTER[provider] || '?';
  const style = sm ? 'width:16px;height:16px;font-size:0.5rem;border-radius:3px;' : '';
  return `<span class="provider-dot ${cls}" style="${style}">${letter}</span>`;
}

function populateModelDropdowns() {
  const providers = [...new Set(INCOGNITO_MODELS.map(m => m.provider))];
  for (let i = 1; i <= 3; i++) {
    const sel = document.getElementById('model' + i);
    sel.innerHTML = '';
    providers.forEach(p => {
      const grp = document.createElement('optgroup');
      grp.label = p;
      INCOGNITO_MODELS.filter(m => m.provider === p).forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.name;
        grp.appendChild(opt);
      });
      sel.appendChild(grp);
    });
    sel.value = MODEL_DEFAULTS[i - 1];
    sel.addEventListener('change', () => updateDot(i));
  }
}

function updateDot(i) {
  const sel = document.getElementById('model' + i);
  const model = INCOGNITO_MODELS.find(m => m.id === sel.value);
  const dot = document.getElementById('dot' + i);
  if (model) {
    dot.className = 'provider-dot ' + (PROVIDER_CSS[model.provider] || '');
    dot.textContent = PROVIDER_LETTER[model.provider] || '?';
  }
}

function getSelectedModels() {
  return [1, 2, 3].map(i => {
    const sel = document.getElementById('model' + i);
    return INCOGNITO_MODELS.find(m => m.id === sel.value)
      || {id: sel.value, name: sel.value, provider: 'Unknown'};
  });
}

populateModelDropdowns();

function populateTeeDropdown() {
  const sel = document.getElementById('model-tee');
  const dot = document.getElementById('dot-tee');
  const providers = [...new Set(TEE_MODELS.map(m => m.provider))];
  providers.forEach(p => {
    const grp = document.createElement('optgroup');
    grp.label = p;
    TEE_MODELS.filter(m => m.provider === p).forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.name;
      grp.appendChild(opt);
    });
    sel.appendChild(grp);
  });
  sel.value = TEE_DEFAULT;
  sel.addEventListener('change', () => {
    const model = TEE_MODELS.find(m => m.id === sel.value);
    if (model) {
      dot.className = 'provider-dot ' + (PROVIDER_CSS[model.provider] || '');
      dot.textContent = PROVIDER_LETTER[model.provider] || '?';
    }
  });
}

function getSelectedTeeModel() {
  const sel = document.getElementById('model-tee');
  return TEE_MODELS.find(m => m.id === sel.value)
    || {id: sel.value, name: sel.value, provider: 'NEAR AI'};
}

populateTeeDropdown();

async function runPipeline() {
  const query = $query.value.trim();
  if (!query) return;

  $run.disabled = true;
  $pipeline.innerHTML = '<div class="loading"><span class="spinner"></span>Running pipeline...</div>';

  try {
    const resp = await fetch('/api/trace', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query, mock: true}),
    });
    const data = await resp.json();
    renderPipeline(data);
  } catch (err) {
    $pipeline.innerHTML = `<div class="loading" style="color:var(--red)">Error: ${err.message}</div>`;
  } finally {
    $run.disabled = false;
  }
}

function renderPipeline(data) {
  $pipeline.innerHTML = '';

  // Steps before the confirmation gate
  const preSteps = [
    () => renderAttestation(data),
    () => renderSanitize(data),
    () => renderDecompose(data),
    () => renderLeakCheck(data),
  ];

  let delay = 0;
  preSteps.forEach((fn, i) => {
    setTimeout(() => {
      appendConnector(i);
      appendStep(fn());
    }, delay);
    delay += 500;
  });

  // After leak check, show the confirm gate
  setTimeout(() => {
    appendConnector(preSteps.length);
    const confirmEl = renderConfirm(data);
    appendStep(confirmEl);
  }, delay);
}

function appendConnector(stepIndex) {
  if (stepIndex > 0) {
    const conn = document.createElement('div');
    conn.className = 'connector';
    conn.style.animationDelay = '0s';
    $pipeline.appendChild(conn);
  }
}

function appendStep(el) {
  el.style.animationDelay = '0.05s';
  $pipeline.appendChild(el);
  el.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

function continueAfterConfirm(data) {
  const postSteps = [
    () => renderRemote(data),
    () => renderRecombine(data),
  ];
  let delay = 0;
  postSteps.forEach((fn, i) => {
    setTimeout(() => {
      appendConnector(1); // always add connector
      appendStep(fn());
    }, delay);
    delay += 500;
  });
}

function makeStep(num, title, subtitle, color, provider) {
  const step = document.createElement('div');
  step.className = 'step';

  const header = document.createElement('div');
  header.className = 'step-header';
  const badge = provider ? PROVIDER_BADGES[provider] : '';
  header.innerHTML = `
    <span class="step-num" style="background:${color}">${num}</span>
    <span class="step-title">${title}</span>
    ${badge}
    ${subtitle ? `<span class="step-subtitle">${subtitle}</span>` : ''}
  `;

  const body = document.createElement('div');
  body.className = 'step-body';

  step.appendChild(header);
  step.appendChild(body);
  step._body = body;
  return step;
}

function highlightPlaceholders(text) {
  return text.replace(/\[([A-Z_]+?)_(\d+)\]/g, (match, cat) => {
    return `<span class="ph ph-${cat}">${match}</span>`;
  });
}

function renderAttestation(data) {
  const att = data.attestation || {};
  const tee = att.tee || {};
  const router = att.incognito_router || {};
  const allOk = tee.verified && router.verified;
  const teeName = getSelectedTeeModel().name;
  const step = makeStep(1, 'Verify Attestation', allOk ? 'All verified' : 'Verification issue', STEP_COLORS.attest);

  function status(ok) {
    return ok
      ? '<span class="status ok">Verified</span>'
      : '<span class="status fail">Failed</span>';
  }
  function item(ok, label, value) {
    const icon = ok ? '\u2705' : '\u274c';
    return `<div class="attest-item"><span class="attest-icon">${icon}</span><span class="attest-label">${label}</span><span class="attest-value">${value}</span></div>`;
  }
  function hashItem(label, hash) {
    return `<div class="attest-item"><span class="attest-icon">\u2705</span><span class="attest-label">${label}</span><span class="attest-hash">${esc(hash)}</span></div>`;
  }

  const enc = tee.enclave || {};
  const tCert = tee.certificate || {};
  const e2ee = tee.e2ee || {};
  const rRouting = router.routing || {};
  const rCert = router.certificate || {};

  let html = '';

  // TEE group
  html += '<div class="attest-group">';
  html += `<div class="attest-group-title">${dotHtml('NEAR AI', true)} Private TEE \u2014 ${esc(teeName)} ${status(tee.verified)}</div>`;
  html += '<div class="attest-items">';
  if (enc.type) html += item(true, 'Enclave', esc(enc.type));
  if (enc.measurement) html += hashItem('Measurement', enc.measurement);
  if (enc.firmware) html += item(true, 'Firmware', esc(enc.firmware));
  if (tCert.issuer) html += item(tCert.chain_verified, 'Certificate', `${esc(tCert.issuer)} (${tCert.chain_verified ? 'valid chain' : 'invalid'})`);
  if (e2ee.protocol) html += item(e2ee.verified, 'E2EE', `${esc(e2ee.protocol)} + ${esc(e2ee.key_exchange || '')}`);
  if (tee.error) html += item(false, 'Error', esc(tee.error));
  html += '</div></div>';

  // Incognito Router group
  html += '<div class="attest-group">';
  html += `<div class="attest-group-title"><span class="provider-badge incognito" style="font-size:0.6rem;padding:0.1rem 0.4rem;"><svg viewBox="0 0 16 16" fill="currentColor" style="width:11px;height:11px;"><path d="M8 2C5 2 2.7 4.7 2 6c-.7 1.3 0 0 0 0C2.7 7.3 5 10 8 10s5.3-2.7 6-4c-.7-1.3-3-4-6-4zm0 6.5A2.5 2.5 0 1 1 8 3.5a2.5 2.5 0 0 1 0 5zM1 12h14v1.5H1z"/></svg></span> Incognito Router ${status(router.verified)}</div>`;
  html += '<div class="attest-items">';
  if (router.gateway) html += item(true, 'Gateway', esc(router.gateway));
  if (rRouting.fragment_isolation !== undefined) html += item(rRouting.fragment_isolation, 'Isolation', 'Fragment isolation between providers');
  if (rRouting.no_shared_context !== undefined) html += item(rRouting.no_shared_context, 'Context', 'No shared conversation context');
  if (rRouting.no_linking_metadata !== undefined) html += item(rRouting.no_linking_metadata, 'Metadata', 'No linking metadata between requests');
  if (rCert.issuer) html += item(rCert.chain_verified, 'Certificate', `${esc(rCert.issuer)} (${rCert.chain_verified ? 'valid chain' : 'invalid'})`);
  if (router.error) html += item(false, 'Error', esc(router.error));
  html += '</div></div>';

  step._body.innerHTML = html;
  return step;
}

function renderSanitize(data) {
  const count = Object.keys(data.placeholder_map).length;
  const tee = getSelectedTeeModel();
  const step = makeStep(2, 'Sanitize', `${count} entities detected · ${tee.name}`, STEP_COLORS.sanitize, 'nearai');

  let html = `<div class="sanitized-text">${highlightPlaceholders(esc(data.sanitized_text))}</div>`;

  if (count > 0) {
    html += '<div class="ph-map">';
    for (const [ph, val] of Object.entries(data.placeholder_map)) {
      const cat = ph.replace(/\[([A-Z_]+?)_\d+\]/, '$1');
      html += `<span class="ph-map-key"><span class="ph ph-${cat}">${esc(ph)}</span></span>`;
      html += `<span class="ph-map-val">\u2192 ${esc(val)}</span>`;
    }
    html += '</div>';
  }

  step._body.innerHTML = html;
  return step;
}

function renderDecompose(data) {
  const tee = getSelectedTeeModel();
  const step = makeStep(3, 'Decompose', `${data.fragments.length} sub-questions · ${tee.name}`, STEP_COLORS.decompose, 'nearai');
  let html = '';
  data.fragments.forEach((f, i) => {
    html += `<div class="fragment-card"><div class="fragment-label" style="color:var(--teal)">Fragment ${i + 1}</div>${esc(f)}</div>`;
  });
  step._body.innerHTML = html;
  return step;
}

function renderLeakCheck(data) {
  const passed = data.leak_checks.filter(r => r.passed).length;
  const total = data.leak_checks.length;
  const allPassed = passed === total;
  const tee = getSelectedTeeModel();
  const subtitle = `${passed}/${total} passed · ${tee.name}`;
  const step = makeStep(4, 'Leak Check', subtitle, STEP_COLORS.leak_check, 'nearai');

  let html = '';
  data.leak_checks.forEach((r, i) => {
    const cls = r.passed ? 'safe' : 'leaked';
    const icon = r.passed ? '\u2705' : '\u274c';
    html += `<div class="fragment-card ${cls}">`;
    html += `<div class="fragment-label ${cls}">${icon} Fragment ${i + 1} \u2014 ${r.passed ? 'Safe' : 'Leaked'}</div>`;
    html += esc(r.text);
    if (r.reason) html += `<div class="leak-reason">${esc(r.reason)}</div>`;
    html += '</div>';
  });

  step._body.innerHTML = html;
  return step;
}

function renderConfirm(data) {
  const safeCount = data.leak_checks.filter(r => r.passed).length;
  const step = makeStep(5, 'Confirm', `${safeCount} fragments ready to send`, STEP_COLORS.confirm);

  let html = '<div style="color:var(--text-muted);margin-bottom:1rem;">These fragments will be sent to Near AI Incognito as separate, unlinkable requests. Review them before approving.</div>';

  const selModels = getSelectedModels();
  data.leak_checks.forEach((r, i) => {
    if (!r.passed) return;
    const m = selModels[i] || selModels[0];
    html += `<div class="fragment-card safe">`;
    html += `<div class="fragment-label safe">Fragment ${i + 1}<span class="confirm-model">\u2192 ${dotHtml(m.provider, true)} ${esc(m.name)}</span></div>`;
    html += esc(r.text);
    html += '</div>';
  });

  if (safeCount === 0) {
    html += '<div class="rejected-banner">No safe fragments \u2014 pipeline will fall back to Near AI-only.</div>';
  } else {
    html += '<div class="confirm-actions">';
    html += '<button class="btn-approve" id="btn-approve">\u2713 Approve &amp; Send</button>';
    html += '<button class="btn-reject" id="btn-reject">\u2717 Reject</button>';
    html += '</div>';
    html += '<div class="confirm-note">Nothing leaves your machine until you approve.</div>';
  }

  step._body.innerHTML = html;

  // Wire up buttons after DOM insertion (use setTimeout so the element is in the DOM)
  setTimeout(() => {
    const approveBtn = document.getElementById('btn-approve');
    const rejectBtn = document.getElementById('btn-reject');
    if (approveBtn) {
      approveBtn.addEventListener('click', () => {
        approveBtn.disabled = true;
        rejectBtn.disabled = true;
        approveBtn.textContent = '\u2713 Approved';
        approveBtn.style.opacity = '0.6';
        rejectBtn.style.display = 'none';
        const note = step._body.querySelector('.confirm-note');
        if (note) note.textContent = 'Fragments sent.';
        continueAfterConfirm(data);
      });
      rejectBtn.addEventListener('click', () => {
        approveBtn.disabled = true;
        rejectBtn.disabled = true;
        rejectBtn.style.opacity = '0.6';
        approveBtn.style.display = 'none';
        const note = step._body.querySelector('.confirm-note');
        if (note) note.remove();
        const banner = document.createElement('div');
        banner.className = 'rejected-banner';
        banner.textContent = 'Rejected \u2014 zero fragments sent. Pipeline falls back to Near AI-only.';
        step._body.appendChild(banner);
      });
    }
  }, 50);

  return step;
}

function renderRemote(data) {
  const n = data.remote_exchanges.length;
  const selModels = getSelectedModels();
  const step = makeStep(6, 'Remote Send', `${n} fragments \u2192 ${n} providers`, STEP_COLORS.remote, 'incognito');

  if (n === 0) {
    step._body.innerHTML = '<div style="color:var(--text-muted);font-style:italic">No fragments sent \u2014 all failed leak check.</div>';
    return step;
  }

  let html = '';
  data.remote_exchanges.forEach((ex, i) => {
    const m = selModels[i] || selModels[0];
    html += '<div class="exchange">';
    html += `<div class="exchange-sent"><div class="exchange-label sent">\u2191 Sent (Fragment ${i + 1})<span class="exchange-model">${dotHtml(m.provider, true)} ${esc(m.provider)} &mdash; ${esc(m.name)}</span></div>${esc(ex.sent)}</div>`;
    html += `<div class="exchange-recv"><div class="exchange-label recv">\u2193 Response</div>${esc(ex.response)}</div>`;
    html += '</div>';
  });

  step._body.innerHTML = html;
  return step;
}

function renderRecombine(data) {
  const tee = getSelectedTeeModel();
  const label = data.tier === 'split' ? 'Merged & de-placeholdered' : 'Fallback';
  const step = makeStep(7, 'Recombine', `${label} · ${tee.name}`, STEP_COLORS.recombine, 'nearai');

  let html = '';

  if (data.answer_with_placeholders !== data.final_answer) {
    html += '<div class="answer-section">';
    html += '<div class="answer-label">With placeholders</div>';
    html += `<div class="answer-block">${highlightPlaceholders(esc(data.answer_with_placeholders))}</div>`;
    html += '</div>';
  }

  html += '<div class="answer-section">';
  html += '<div class="answer-label">Final answer</div>';
  html += `<div class="answer-block">${formatAnswer(esc(data.final_answer))}</div>`;
  html += '</div>';

  step._body.innerHTML = html;
  return step;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function formatAnswer(html) {
  return html
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}
