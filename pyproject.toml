[project]
name = "query-router"
version = "0.1.0"
description = "Privacy-preserving query router – Tier 1 (splittable)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "tinfoil",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
markers = [
    "llm: tests that require Tinfoil API access",
]
asyncio_mode = "auto"
